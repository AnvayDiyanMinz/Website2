}
header{
background-color: #c9dae9;

height:150px;
align: left;
}

header::after {
content:'';display:table;clear:both;
}

nav ul li a {
text-decoration:none;
color: #670a0a;
margin:10px;
font-size: 20px;
}

nav a{color:#c3fdff;text-transform:uppercase;font-size:20px;text-decoration:none}

nav a:hover{color:#01579b}

nav a::before{content:" ";display:block;top:50px;width:0%;
    height:3px;background-color:blue;transition:ease-in-out 500ms;}
    nav a:hover::before{width:100%;}

}


.wrapper .inputfield {
margin-bottom: 10px;
}

.wrapper .inputfield input[type=text], .wrapper textarea {border:3px solid pink;width:100%;padding:10px;
}

.wrapper {
position: absolute;
margin-left: 30%;
margin-top: 10%;
transform-translate (50, 50);
max-width: 500px;
width: 100%;
background-color: lightblue;
align: center;
padding: 20px;
border-radius: 15px;
}

.wrapper textarea {
resize: none;
height: 80px;
}

.wrapper .btn input[type=submit] {
margin-top:15px; padding:10px;
text-align:center;width:100%;background-color:#7c9cff;
color:black;text-transform:uppercase;letter-spacing:6px;
font-weight:bold;border-radius:25px;cursor:pointer;
}
</style>

<script>
function validate()
{
var name1=document.getElementById("name1").value;
var phone1=document.getElementById("phone1").value;
var email1=document.getElementById("email1").value;
var message1=document.getElementById("message1").value;

if(name1.length<6){
text="Please Enter Full name";
errormessage.innerHTML=text;
return false;
}

if(isNaN(phone1)||phone1.length!=10) {
text="Please Enter a valid Phone Number";
errormessage.innerHTML=text;
return false;
}

if(email1.indexOf("@")==-1||email1.length<6) {
text="Please Enter a valid Email Address";
errormessage.innerHTML=text;
return false;
}

if(message1.length<=20) {
text="Please Enter more than 50 Characters";
errormessage.innerHTML=text;
return false;
}

alert("Form Submitted Successsfully!!");
return true;
}
</script>
